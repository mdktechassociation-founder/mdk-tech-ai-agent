name: Windows desktop build

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows runner
        working-directory: apps/flutter_agent
        run: flutter create --platforms=windows .
      - name: Set up Python for bundled backend
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/agent_api/requirements.txt
      - name: Build bundled backend EXE
        working-directory: services/agent_api
        shell: powershell
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --clean --onefile --name mdk-agent-api --paths . launcher.py
      - name: Get packages
        working-directory: apps/flutter_agent
        run: flutter pub get
      - name: Build release
        working-directory: apps/flutter_agent
        run: flutter build windows --release
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress --yes
      - name: Build single-file installer
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\mdk_agent.iss'
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: mdk-agent-installer
          path: dist/MDK-Agent-Setup-v*.exe
          if-no-files-found: error
