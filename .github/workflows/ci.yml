name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and security checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agent_api
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/agent_api/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: PYTHONPATH=. pytest -q
      - name: Lint
        run: ruff check app tests scripts
      - name: Audit dependencies
        run: pip-audit -r requirements.txt

  flutter:
    name: Flutter analysis and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter_agent
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform runners
        run: flutter create --platforms=windows .
      - name: Get packages
        run: flutter pub get
      - name: Format Dart sources
        run: dart format lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
